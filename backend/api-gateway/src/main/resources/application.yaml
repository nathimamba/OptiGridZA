server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "${CORS_ALLOWED_ORIGIN:http://localhost:5173}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: company-service
              uri: lb://company-service
              predicates:
                - Path=/api/v1/companies/**

            - id: etl-service
              uri: lb://etl-service
              predicates:
                - Path=/api/v1/etl/**

            - id: prediction-service
              uri: lb://prediction-service
              predicates:
                - Path=/api/v1/prediction/**

            - id: simulation-service
              uri: lb://simulation-service
              predicates:
                - Path=/api/v1/simulation/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

            - id: ticket-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/tickets/**

            - id: auth-actuator
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/health/auth
              filters:
                - RewritePath=/api/v1/health/auth, /actuator/health

            - id: company-actuator
              uri: lb://company-service
              predicates:
                - Path=/api/v1/health/company
              filters:
                - RewritePath=/api/v1/health/company, /actuator/health

            - id: etl-actuator
              uri: lb://etl-service
              predicates:
                - Path=/api/v1/health/etl
              filters:
                - RewritePath=/api/v1/health/etl, /actuator/health

            - id: prediction-actuator
              uri: lb://prediction-service
              predicates:
                - Path=/api/v1/health/prediction
              filters:
                - RewritePath=/api/v1/health/prediction, /actuator/health

            - id: simulation-actuator
              uri: lb://simulation-service
              predicates:
                - Path=/api/v1/health/simulation
              filters:
                - RewritePath=/api/v1/health/simulation, /actuator/health

            - id: notification-actuator
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/health/notification
              filters:
                - RewritePath=/api/v1/health/notification, /actuator/health

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info