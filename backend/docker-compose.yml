services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: optigridza_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - optigrid-network

  eureka-service:
    build: ./eureka-service
    container_name: eureka-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1 -Xms256m -Xmx512m
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: "true"
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - optigrid-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      EUREKA_URI: http://eureka-service:8761/eureka/
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "15"
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "45"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "15"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xms256m -Xmx512m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "3"
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - optigrid-network

  company-service:
    build: ./company-service
    container_name: company-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      EUREKA_URI: http://eureka-service:8761/eureka/
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "15"
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "45"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "15"
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xms256m -Xmx512m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "3"
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - optigrid-network

  etl-service:
    build: ./etl-service
    container_name: etl-service
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      EUREKA_URI: http://eureka-service:8761/eureka/
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "15"
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "45"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "15"
      APP_DATA_FETCH_ENABLED: ${APP_DATA_FETCH_ENABLED:-false}
      ESKOM_API_KEY: ${ESKOM_API_KEY:-}
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xms256m -Xmx512m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "3"
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - optigrid-network

  simulation-service:
    build: ./simulation-service
    container_name: simulation-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      EUREKA_URI: http://eureka-service:8761/eureka/
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "15"
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "45"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "15"
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xms256m -Xmx512m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "3"
    ports:
      - "127.0.0.1:8085:8085"
    networks:
      - optigrid-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      EUREKA_URI: http://eureka-service:8761/eureka/
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "15"
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "45"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "15"
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xms256m -Xmx512m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "3"
    ports:
      - "127.0.0.1:8086:8086"
    networks:
      - optigrid-network

  prediction-service:
    build: ./prediction-service
    container_name: prediction-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
      simulation-service:
        condition: service_started
      etl-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      EUREKA_URI: http://eureka-service:8761/eureka/
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "15"
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "45"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "15"
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xms512m -Xmx1024m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "15"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
    ports:
      - "127.0.0.1:8084:8084"
    networks:
      - optigrid-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      eureka-service:
        condition: service_started
      auth-service:
        condition: service_started
    environment:
      EUREKA_URI: http://eureka-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "15"
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: "45"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "15"
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xms256m -Xmx512m
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "20"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "5"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - optigrid-network

networks:
  optigrid-network:
    driver: bridge

volumes:
  postgres_data:
