version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: optigridza_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin@123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - optigrid-network

  eureka-service:
    build: ./eureka-service
    container_name: eureka-service
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - optigrid-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      - eureka-service
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - optigrid-network

  company-service:
    build: ./company-service
    container_name: company-service
    restart: unless-stopped
    depends_on:
      - eureka-service
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - optigrid-network

  etl-service:
    build: ./etl-service
    container_name: etl-service
    restart: unless-stopped
    init: true
    depends_on:
      - eureka-service
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      APP_DATA_FETCH_ENABLED: ${APP_DATA_FETCH_ENABLED:-false}
      ESKOM_API_KEY: ${ESKOM_API_KEY:-A129B4CD-069D4E92-9E4DE31D-09C7934A}
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - optigrid-network

  prediction-service:
    build: ./prediction-service
    container_name: prediction-service
    restart: unless-stopped
    depends_on:
      - eureka-service
      - postgres
      - etl-service
      - simulation-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1
    ports:
      - "127.0.0.1:8084:8084"
    networks:
      - optigrid-network

  simulation-service:
    build: ./simulation-service
    container_name: simulation-service
    restart: unless-stopped
    depends_on:
      - eureka-service
      - postgres
      - notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1
    ports:
      - "127.0.0.1:8085:8085"
    networks:
      - optigrid-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    depends_on:
      - eureka-service
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optigridza_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin@123
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1
    ports:
      - "127.0.0.1:8086:8086"
    networks:
      - optigrid-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - eureka-service
      - auth-service
      - company-service
      - etl-service
      - prediction-service
      - simulation-service
      - notification-service
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=1 -Xms128m -Xmx512m
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - optigrid-network

networks:
  optigrid-network:
    driver: bridge

volumes:
  postgres_data: